# Prevents Google dorking attacks by telling search engines to not index the page/server.
# Note: Pages/servers can be discovered via other methods such as via DNS enumeration or
# certificate transparency logs such as https://crt.sh security through obscurity should not be relied on.

more_set_headers "X-Robots-Tag : noindex, nofollow";

location /robots.txt
{
return 200 "User-agent: *
Disallow: /";
}
